# RETIRED 2026-10-13: not in the active manifest (evident/evident.yaml). Frozen text unchanged;
# results stay reported. See evident/retired/RETIRED.md.
# Search-engine score distributions (DIA-NN, FragPipe), sim vs real.
# Pre-registered 2026-10-12 before any of these data were produced.
claims:
- id: vm.scores.qvalue.diann
  title: 'DIA-NN target q-value distribution: sim vs real'
  kind: measurement
  subsystem: timsim.discrepancy
  case: vm.md
  source: ..
  tier: research
  trust_strategy:
  - validation
  capabilities:
  - sim-real-transfer
  inputs:
    corpus: matched-complexity sims (3 seeds) vs PXD029836 10 ng LS10/LS11/LS12, plain-library searches
    n: 6
    class: real-run
  outputs:
    ratio:
      unit: ratio
      description: median sim-real W1 / max real-real W1 for DIA-NN log10 q-value.
  pinned_versions:
    rustims: 85260d52
    DIA-NN: 2.5.1
  claim: Distribution of log10 Q.Value over target precursors in the plain-library report (reported up
    to Q.Value 0.05). The median sim-vs-real 1-Wasserstein distance is at most 3 times the largest real-vs-real
    replicate distance.
  gist:
    what: "The simulated DIA-NN q-values (its confidence in each match) are distributed like real ones, about as closely as two real repeat runs match."
    why: "Scores show whether search tools see the simulation as realistic."
    wrong_if: The sim-vs-real distance is more than 3 times the largest replicate distance.
  tolerances:
  - metric: discrepancy_ratio
    op: <=
    value: 3
    output: ratio
    prose: median sim-real W1 / max real-real W1 <= 3
  evidence:
    oracle:
    - DIA-NN
    command: python evident/vm/vm_scores.py
    artifact: TIMSIM-REVISION/searches/vm/analysis-v1/results/scores.json
  provenance: automatic
  last_verified:
    commit: null
    date: null
    value: null
  assumptions:
  - Matched complexity per vm.protocol.matched-complexity. Distances use equal-count subsampling (20 reps).
  - The 3x margin is descriptive (vm.protocol.transfer-direction). Direction claims decide what transfers.
  failure_modes:
  - Three real runs from one batch give a small replicate distance.
  - DIA-NN reports only precursors under its cutoff, so this is the q-value distribution of the reported
    window, not of all candidates.
