# RETIRED 2026-10-13: not in the active manifest (evident/evident.yaml). Frozen text unchanged;
# results stay reported. See evident/retired/RETIRED.md.
# Views (i) all ions and (ii) identified ions: RT, IM and m/z marginals.
# Pre-registered 2026-10-12 before any of these data were produced.
claims:
- id: vm.marginal.rt.identified.diann
  title: 'Identified-precursor rt marginal: sim vs real'
  kind: measurement
  subsystem: timsim.discrepancy
  case: vm.md
  source: ..
  tier: research
  trust_strategy:
  - validation
  capabilities:
  - sim-real-transfer
  inputs:
    corpus: matched-complexity sims (3 seeds) vs PXD029836 10 ng LS10/LS11/LS12, plain-library searches
    n: 6
    class: real-run
  outputs:
    ratio:
      unit: ratio
      description: median sim-real W1 / max real-real W1 for identified-precursor rt.
  pinned_versions: &id001
    rustims: 85260d52
    DIA-NN: 2.5.1
  claim: Marginal distribution of retention time, min over precursors accepted at run-level Q.Value <=
    0.01 (view ii, sim and real). The median sim-vs-real 1-Wasserstein distance is at most 3
    times the largest real-vs-real replicate distance.
  gist:
    what: "The retention times of identified peptides are spread in the simulation like in real data, about as closely as two real repeat runs match."
    why: "It shows which simulated properties match real data, for the peptides the search finds."
    wrong_if: The sim-vs-real distance is more than 3 times the largest replicate distance.
  tolerances:
  - metric: discrepancy_ratio
    op: <=
    value: 3
    output: ratio
    prose: median sim-real W1 / max real-real W1 <= 3
  evidence:
    oracle:
    - DIA-NN
    command: python evident/vm/vm_marginals.py
    artifact: TIMSIM-REVISION/searches/vm/analysis-v1/results/marginals.json
  provenance: automatic
  last_verified:
    commit: null
    date: null
    value: null
  assumptions:
  - Matched complexity per vm.protocol.matched-complexity. Distances use equal-count subsampling (20 reps).
  - The 3x margin is descriptive (vm.protocol.transfer-direction). Direction claims decide what transfers.
  failure_modes:
  - Three real runs from one batch give a small replicate distance.
- id: vm.marginal.rt.allions.raw
  title: 'All-ion MS1 signal rt marginal: sim vs real (no identification)'
  kind: measurement
  subsystem: timsim.discrepancy
  case: vm.md
  source: ..
  tier: research
  trust_strategy:
  - validation
  capabilities:
  - sim-real-transfer
  inputs:
    corpus: matched-complexity sim .d (3 seeds) vs PXD029836 10 ng LS10/LS11/LS12 .d
    n: 6
    class: real-run
  outputs:
    ratio:
      unit: ratio
      description: median sim-real W1 / max real-real W1 for all-ion MS1 rt.
  pinned_versions:
    rustims: 85260d52
    timsim-ground-truth: imspy-core 0.4.4 @ 85260d52
  claim: Intensity-weighted marginal of retention time, min over all MS1 peaks read from the raw .d with
    imspy (view i), on fixed bins (RT 0.25 min, 1/K0 0.005, m/z 2 Th), every MS1 frame. W1 is
    taken on the binned distributions. The median sim-vs-real 1-Wasserstein distance is at most 3 times
    the largest real-vs-real replicate distance.
  gist:
    what: "The retention times of all precursor signal in the raw files are spread in the simulation like in real data, about as closely as two real repeat runs match."
    why: "It shows which simulated properties match real data, for all signal, identified or not."
    wrong_if: The sim-vs-real distance is more than 3 times the largest replicate distance.
  tolerances:
  - metric: discrepancy_ratio
    op: <=
    value: 3
    output: ratio
    prose: median sim-real W1 / max real-real W1 <= 3
  evidence:
    oracle:
    - timsim-ground-truth
    command: python evident/vm/vm_marginals.py
    artifact: TIMSIM-REVISION/searches/vm/raw-v1/
  provenance: automatic
  last_verified:
    commit: null
    date: null
    value: null
  assumptions:
  - Matched complexity per vm.protocol.matched-complexity. Distances use equal-count subsampling (20 reps).
  - The 3x margin is descriptive (vm.protocol.transfer-direction). Direction claims decide what transfers.
  - 'Raw peaks are a proxy for ''all ions'': there is no isotope deconvolution, so charge is not available
    in this view.'
  failure_modes:
  - Three real runs from one batch give a small replicate distance.
  - The baseline sims have no background overlay, so real chemical background and singly charged ions
    are absent from the sim. A large ratio is expected there and is a known gap, not a surprise.
