  inputs: *id005
  outputs:
    fdp_delta_max:
      unit: fraction
      description: Max over settings of the absolute paired mean FDP change from baseline.
  pinned_versions: *id002
  claim: Stress row 'rt-peakshape' (chromatographic peak width and skew). Settings are listed in evident/vm/stress_settings.yaml,
    and that file is committed from the section-3 discrepancy results before any stress FDP is computed.
    For each setting, |mean over seeds of FDP(stress) - mean over the same seeds of FDP(baseline at matched
    complexity)| is at most 0.005.
  gist:
    what: "When the simulated chromatographic peaks are made wider or more skewed, DIA-NN's share of wrong peptide ions changes by at most half a percentage point."
    why: "This tests stability; an error rate can stay put and still be too high, so it is checked apart from the 1.5% ceiling."
    wrong_if: Any rt-peakshape setting moves mean true FDP by more than 0.5 percentage points.
  tolerances:
  - metric: absolute_error
    op: <=
    value: 0.005
    output: fdp_delta_max
    prose: max over rt-peakshape settings of |mean FDP(stress) - mean FDP(baseline)| <= 0.005
  evidence:
