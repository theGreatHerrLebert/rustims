# RETIRED 2026-10-13: not in the active manifest (evident/evident.yaml). Frozen text unchanged;
# results stay reported. See evident/retired/RETIRED.md.
# Entrapment on simulated and real data (VM plan v3 section 5).
# Framework: Wen et al., Nat Methods 2025, doi:10.1038/s41592-025-02719-x.
# Tool: FDRBench 1.1.1. Paired shuffled peptide-level entrapment, r = 1,
# C-term fixed, I->L, seed 2026. One entrapment shuffle this round.
# FDP values are fractions (0.01 = 1%).

claims:
  - id: entrap.verdict.diann.real10
    title: DIA-NN 2.5.1 entrapment verdict at 1% precursor level on real 10 ng runs
    kind: measurement
    subsystem: timsim.entrapment
    case: vm.md
    source: ..
    tier: research
    trust_strategy:
      - validation
    inputs:
      corpus: PXD029836 10 ng LS10/LS11/LS12
      n: 3
      class: real-run
    outputs:
      paired_upper_max:
        unit: fraction
        description: Maximum over runs of the FDRBench paired estimate at run-level Q.Value <= 0.01.
      lower_bound_max:
        unit: fraction
        description: Maximum over runs of the FDRBench lower-bound estimate at the same threshold.
    pinned_versions:
      rustims: 85260d52
      DIA-NN: "2.5.1"
      FDRBench: "1.1.1"
    claim: >
      Derived verdict. Every run is valid if paired_upper_max <= 0.01 (both
      tolerances pass). Some run is invalid if lower_bound_max > 0.01 (second
      tolerance fails). Otherwise the result is inconclusive. Per-run classes
      and numeric bounds are always reported. This is an empirical
      classification, not a confidence statement.
    gist:
      what: "On real 10 ng runs, entrapment shows whether DIA-NN's 1% error cutoff holds, fails, or cannot be decided."
      why: "This is the real-data reference that the simulated verdict is compared with."
      wrong_if: The paired upper estimate exceeds 1% in any run. Invalid if the lower bound also exceeds 1%.
    tolerances:
      - metric: fdp
        op: "<="
        value: 0.01
        output: paired_upper_max
        prose: max over real runs of FDRBench paired FDP <= 0.01 (valid).
      - metric: fdp
        op: "<="
        value: 0.01
        output: lower_bound_max
        prose: max over real runs of FDRBench lower-bound FDP <= 0.01 (not invalid).
    evidence:
      oracle:
        - DIA-NN
        - FDRBench
      command: python evident/vm/vm_truth_fdp.py --mode verdict --side real10
      artifact: TIMSIM-REVISION/searches/vm/recipe-v1/real10/
    provenance: automatic
    last_verified:
      commit: null
      date: null
      value: null
    assumptions:
      - Shuffled entrapment peptides are not present in the real HeLa sample.
    failure_modes:
      - Background-only real signal can match an entrapment peptide, and that
        cannot be told apart from a false discovery.

  - id: entrap.verdict.diann.sim-matched
    title: DIA-NN 2.5.1 entrapment verdict at 1% precursor level on matched TimSim runs
    kind: measurement
    subsystem: timsim.entrapment
    case: vm.md
    source: ..
    tier: research
    trust_strategy:
      - validation
    inputs:
      corpus: matched-complexity sims (3 seeds)
      n: 3
      class: synthetic
    outputs:
      paired_upper_max:
        unit: fraction
        description: Maximum over matched sim runs of the FDRBench paired estimate at run-level Q.Value <= 0.01.
      lower_bound_max:
        unit: fraction
        description: Maximum over matched sim runs of the FDRBench lower-bound estimate.
    pinned_versions:
      rustims: 85260d52
      DIA-NN: "2.5.1"
      FDRBench: "1.1.1"
    claim: >
      Same derived verdict rule as entrap.verdict.diann.real10, applied to the
      three matched-complexity sim runs.
    gist:
      what: "The same check of DIA-NN's 1% error cutoff, done on the simulated runs matched to the real ones."
      why: "This is the simulated side of that comparison."
      wrong_if: The paired upper estimate exceeds 1% in any matched sim run.
    tolerances:
      - metric: fdp
        op: "<="
        value: 0.01
        output: paired_upper_max
        prose: max over matched sim runs of FDRBench paired FDP <= 0.01 (valid).
      - metric: fdp
        op: "<="
        value: 0.01
        output: lower_bound_max
        prose: max over matched sim runs of FDRBench lower-bound FDP <= 0.01 (not invalid).
    evidence:
      oracle:
        - DIA-NN
        - FDRBench
      command: python evident/vm/vm_truth_fdp.py --mode verdict --side sim
      artifact: TIMSIM-REVISION/searches/vm/recipe-v1/sim/
    provenance: automatic
    last_verified:
      commit: null
      date: null
      value: null
    assumptions:
      - Same as entrap.sim.estimator-bias.diann.
    failure_modes:
      - Same as entrap.verdict.diann.real10, except background matches cannot
        occur because there is no overlay.
