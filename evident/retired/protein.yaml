- id: entrap.protein.sim-vs-real.diann
  title: Protein-level entrapment estimate on matched sims within 0.5 pp of real
  kind: measurement
  subsystem: timsim.entrapment
  case: vm.md
  source: ..
  tier: research
  trust_strategy:
  - validation
  capabilities:
  - entrapment-estimator-check
  inputs:
    corpus: matched-complexity sims (3 seeds) vs PXD029836 10 ng LS10/LS11/LS12
    n: 6
    class: real-run
  outputs:
    combined_abs_diff:
      unit: fraction
      description: '|mean_sim(combined) - mean_real(combined)|'
  pinned_versions: *id001
  claim: '|mean combined estimate over matched sims - mean over the real 10 ng runs| <= 0.005, or the
    modal verdict class is the same (class reported in results; the tolerance is the band).'
  gist:
    what: "The protein-level entrapment estimate comes out about the same on simulated and real runs."
    why: "It compares simulation and reality on protein error rates, where peptide-level control can hide failures."
    wrong_if: The means differ by more than 0.5 percentage points.
  tolerances:
  - metric: absolute_error
    op: <=
    value: 0.005
    output: combined_abs_diff
    prose: '|mean_sim - mean_real| <= 0.005'
  evidence:
    oracle:
    - DIA-NN
    - FDRBench
    command: python evident/vm/vm_protein.py
    artifact: TIMSIM-REVISION/searches/vm/recipe-v1-protein/
  provenance: automatic
  last_verified:
    commit: null
    date: null
    value: null
  assumptions:
  - Estimand and truth per vm.protocol.protein-estimand.
  failure_modes:
  - Protein-level FDP has fewer discoveries than precursor level, so seed-to-seed spread is larger.
