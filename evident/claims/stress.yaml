# Stress test (VM plan v3 section 4). Frozen bounds: 1.5% absolute, 0.5 pp delta, 1% nominal.
# Generated from a template; edit values only through a new claim id (see evident.yaml).
claims:
- id: vm.baseline.fdp-bound.diann
  title: True precursor FDP of DIA-NN 2.5.1 at 1% is at most 1.5% on every baseline TimSim run
  kind: measurement
  subsystem: timsim.stress
  case: vm.md
  source: ..
  tier: research
  trust_strategy:
  - validation
  capabilities:
  - fdp-measurement-under-simulation
  inputs: &id001
    corpus: vm-sim-baseline jitter 50k/125k/250k x 3 seeds
    n: 9
    class: synthetic
  outputs:
    fdp_max:
      unit: fraction
      description: Maximum true FDP over the 9 baseline runs, reported with false and accepted counts.
  pinned_versions: &id002
    rustims: 85260d52
    timsim-ground-truth: imspy-simulation 0.4.5 @ 85260d52
    DIA-NN: 2.5.1
  claim: On each of the nine baseline TimSim runs, the true FDP of DIA-NN 2.5.1 at run-level Q.Value <=
    0.01 is at most 0.015. A pass supports 'FDP <= 1.5%', not nominal 1% control.
  gist:
    what: On every baseline simulated run, DIA-NN's true error rate at its 1% cutoff stays at or below
      1.5%.
    why: This is the upper bound the stress settings are checked against.
    wrong_if: Any baseline run has true FDP above 1.5%.
  tolerances:
  - metric: fdp
    op: <=
    value: 0.015
    output: fdp_max
    prose: max over 9 baseline runs of true FDP <= 0.015
  evidence:
    oracle: &id003
    - timsim-ground-truth
    - DIA-NN
    command: python evident/vm/vm_truth_fdp.py --mode stress --claim vm.baseline.fdp-bound.diann
    artifact: TIMSIM-REVISION/searches/vm/recipe-v1/sim/
  provenance: automatic
  last_verified:
    commit: null
    date: null
    value: null
  assumptions:
  - Truth FDP uses the plain-library search, the primary estimand (vm.protocol.estimand) and vm.protocol.truth-rule.
  - Seeds are shared between baseline and stress settings, so comparisons are paired.
  failure_modes:
  - Holds at the tested settings only. Nothing is interpolated between settings.
  - A stable but inflated FDP is reported as inflated. Stability does not imply control.
- id: vm.baseline.fdp-nominal.diann
  title: Mean true precursor FDP of DIA-NN 2.5.1 at 1% is at most 1% over baseline TimSim runs
  kind: measurement
  subsystem: timsim.stress
  case: vm.md
  source: ..
  tier: research
  trust_strategy:
  - validation
  capabilities:
  - fdp-measurement-under-simulation
  inputs: *id001
  outputs:
    fdp_mean:
      unit: fraction
      description: Mean true FDP over the 9 baseline runs.
  pinned_versions: *id002
  claim: The mean true FDP over the nine baseline runs at run-level Q.Value <= 0.01 is at most 0.010.
    Per-complexity means and the spread across seeds are reported.
  gist:
    what: On average over the simulated runs, DIA-NN's 1% cutoff delivers at most 1% true false discoveries.
    why: Nominal control is a separate, stronger claim than the 1.5% bound.
    wrong_if: The mean true FDP over the nine baseline runs is above 1%.
  tolerances:
  - metric: fdp
    op: <=
    value: 0.01
    output: fdp_mean
    prose: mean over 9 baseline runs of true FDP <= 0.010
  evidence:
    oracle: *id003
    command: python evident/vm/vm_truth_fdp.py --mode stress --claim vm.baseline.fdp-nominal.diann
    artifact: TIMSIM-REVISION/searches/vm/recipe-v1/sim/
  provenance: automatic
  last_verified:
    commit: null
    date: null
    value: null
  assumptions:
  - Truth FDP uses the plain-library search, the primary estimand (vm.protocol.estimand) and vm.protocol.truth-rule.
  - Seeds are shared between baseline and stress settings, so comparisons are paired.
  failure_modes:
  - Holds at the tested settings only. Nothing is interpolated between settings.
  - A stable but inflated FDP is reported as inflated. Stability does not imply control.
  - A mean can hide one complexity that is above 1%. Read the per-complexity values.
