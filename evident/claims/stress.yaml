- id: vm.mass-accuracy.fdp-delta.diann
  title: True DIA-NN FDP moves at most 0.5 pp under mass-accuracy stress
  kind: measurement
  subsystem: timsim.stress
  case: vm.md
  source: ..
  tier: research
  trust_strategy:
  - validation
  capabilities:
  - fdp-measurement-under-simulation
  inputs: *id004
  outputs:
    fdp_delta_max:
      unit: fraction
      description: Max over settings of the absolute paired mean FDP change from baseline.
  pinned_versions: *id002
  claim: Stress row 'mass-accuracy' (MS1/MS2 m/z error (offset, sigma, tails)). Settings are listed in
    evident/vm/stress_settings.yaml, and that file is committed from the section-3 discrepancy results
    before any stress FDP is computed. For each setting, |mean over seeds of FDP(stress) - mean over the
    same seeds of FDP(baseline at matched complexity)| is at most 0.005.
  gist:
    what: Plausible mass-accuracy mismatch changes DIA-NN's true error rate by at most half a percentage
      point.
    why: It separates stability from the absolute bound. An error rate can be stable and still inflated.
    wrong_if: Any mass-accuracy setting moves mean true FDP by more than 0.5 percentage points.
  tolerances:
  - metric: absolute_error
    op: <=
    value: 0.005
    output: fdp_delta_max
    prose: max over mass-accuracy settings of |mean FDP(stress) - mean FDP(baseline)| <= 0.005
  evidence:
    oracle: *id003
    command: python evident/vm/vm_truth_fdp.py --mode stress --claim vm.mass-accuracy.fdp-delta.diann
