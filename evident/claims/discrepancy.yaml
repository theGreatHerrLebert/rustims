# Section-3 discrepancy (VM plan v3). Frozen margin: sim-real distance <= 3x max real-real replicate distance.
# Generated from a template. Change values only through a new claim id (see evident.yaml).
claims:
- id: vm.discrepancy.ms1_ppm.diann
  title: Sim-vs-real distance for ms1_ppm is within 3x the real replicate distance
  kind: measurement
  subsystem: timsim.discrepancy
  case: vm.md
  source: ..
  tier: research
  trust_strategy:
  - validation
  capabilities:
  - sim-real-transfer
  inputs:
    corpus: matched-complexity sims (3 seeds) vs PXD029836 10 ng LS10/LS11/LS12, plain-library searches
    n: 6
    class: real-run
  outputs:
    ratio:
      unit: ratio
      description: 'median over 9 sim-real run pairs of the 1-Wasserstein distance (equal-count subsampled,
        20 reps) / max over 3 real-real pairs. Observable: MS1 apex m/z delta, ppm (Th / m/z).'
  pinned_versions:
    rustims: 85260d52
    DIA-NN: 2.5.1
  claim: 'Matrix row: mass accuracy. For MS1 apex m/z delta, ppm (Th / m/z), among precursors accepted
    at run-level Q.Value <= 0.01 (all-IDs view) at the matched complexity (vm.protocol.matched-complexity),
    the median sim-vs-real 1-Wasserstein distance (equal-count subsampled, 20 reps) is at most 3 times
    the largest real-vs-real replicate distance. A ratio above 3 is a flagged mismatch that becomes a
    stress-test candidate. The shared-precursor view and the tail summaries (q05/q50/q95, fraction beyond
    3 MAD) are reported but carry no tolerance.'
  gist:
    what: The simulated ms1_ppm distribution differs from real about as much as real replicates differ
      from each other.
    why: This says which simulated properties are close enough to real data and which need a stress test.
    wrong_if: The sim-vs-real distance is more than 3 times the largest real-vs-real replicate distance.
  tolerances:
  - metric: discrepancy_ratio
    op: <=
    value: 3
    output: ratio
    prose: median sim-real distance / max real-real distance <= 3 (all-IDs view, matched complexity)
  evidence:
    oracle:
    - DIA-NN
    command: python evident/vm/vm_discrepancy.py
    artifact: TIMSIM-REVISION/searches/vm/analysis-v1/results/discrepancy.json
  provenance: automatic
  last_verified:
    commit: null
    date: null
    value: null
  assumptions:
  - DIA-NN is the common assay. Distances are conditional on identification, which favours easy precursors
    on both sides.
  - Three real runs from one batch give a small, possibly optimistic replicate distance. The ratio is
    read with that in mind.
  - The 3x margin is set before any discrepancy value was seen. Downstream relevance is judged by the
    stress test, not here.
  failure_modes:
  - Mass deltas are truncated by the fixed 15 ppm search tolerance, so tails beyond it are invisible.
  - RT/IM residuals are measured after DIA-NN alignment and calibration, which can absorb a systematic
    mismatch.
  - A 0/0 ratio is reported as not assessed. A zero replicate distance with any sim distance fails.
