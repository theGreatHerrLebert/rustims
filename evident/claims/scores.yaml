# Search-engine score distributions (DIA-NN, FragPipe), sim vs real.
# Pre-registered 2026-10-12 before any of these data were produced.
claims:
- id: vm.direction.scores.sim-not-harder.fragpipe
  title: TimSim is not harder than real 10 ng data on any fragpipe score feature
  kind: measurement
  subsystem: timsim.discrepancy
  case: vm.md
  source: ..
  tier: research
  trust_strategy:
  - understanding
  capabilities:
  - sim-real-transfer
  inputs:
    corpus: 'FragPipe 24 lowload workflow, one experiment per run: matched sims (3 seeds) vs PXD029836
      10 ng LS10/11/12'
    n: 6
    class: real-run
  outputs:
    n_harder:
      unit: count
      description: Number of features with the sim beyond the real range on the harder side.
  pinned_versions: &id001
    rustims: 85260d52
    FragPipe: '24.0'
  claim: 'Features: target-vs-decoy AUC of the Percolator score over all PSMs from the kept Percolator
    target and decoy tables (higher is easier); median hyperscore and median SpectralSim of accepted PSMs
    (higher is easier); median log10 expectation of accepted PSMs (lower is easier). The per-run statistic
    is computed on each side. The sim value is the median over the matched seeds. The feature is easier
    or harder if the sim lies outside the [min, max] range of the three real runs on that side, and comparable
    otherwise. The claim is n_harder = 0.'
  gist:
    what: "On every FragPipe score signal, the simulated runs are no harder to search than the real runs."
    why: "This checks the 'not harder' rule with a second search engine, not only DIA-NN."
    wrong_if: Any feature puts the sim outside the real range on the harder side.
  tolerances:
  - metric: absolute_error
    op: <=
    value: 0
    output: n_harder
    prose: number of features classed harder == 0
  evidence:
    oracle: &id002
    - FragPipe
    command: python evident/vm/vm_scores.py
    artifact: TIMSIM-REVISION/searches/vm/fragpipe-v1/
  provenance: automatic
  last_verified:
    commit: null
    date: null
    value: null
  assumptions:
  - Read under vm.protocol.transfer-direction.
  failure_modes:
  - Three real runs give a narrow range.
