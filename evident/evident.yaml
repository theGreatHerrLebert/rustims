version: 0.1
project: rustims

# Internal EVIDENT manifest for the TimSim validity matrix.
# Internal check only: nothing here goes into a publication or data deposit.
#
# Pre-registration: every numeric bound, band and decision rule in claims/
# was committed before any FDP result (real or simulated) was inspected.
# Later commits may fill last_verified and pin corpora, but must not change
# a tolerance value, op, output or estimand. A changed rule is a new claim
# id, and the frozen one stays and is reported.
#
# Validate with evident/workflow/validate_manifest.py from the EVIDENT repo.
#
# 2026-10-13: 59 claims registered, 22 active, 37 retired (not deleted):
# their frozen text is in retired/ and their results stay reported (retired/RETIRED.md).
# Every rule and tolerance here was committed before its data were inspected.

vocabularies:
  subsystem:
    - timsim.fdp
    - timsim.entrapment
    - timsim.stress
    - timsim.protocol
    - timsim.discrepancy
  oracle:
    - timsim-ground-truth
    - DIA-NN
    - FDRBench
    - FragPipe
  capability:
    - fdp-measurement-under-simulation
    - entrapment-estimator-check
    - sim-real-transfer
  tolerance_metric:
    - fdp
    - signed_difference
    - discrepancy_ratio
  input_class:
    - real-run

include:
  - claims/protocol.yaml
  - claims/entrapment.yaml
  - claims/stress.yaml
  - claims/direction.yaml
  - claims/scores.yaml
  - claims/protein.yaml
